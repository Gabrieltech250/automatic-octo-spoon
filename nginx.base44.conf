server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Babel-transpiled app.js — served as plain JS (browser transpiles it)
    location /app.js {
        default_type text/babel;
    }
}
